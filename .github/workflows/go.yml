name: Test
on: [push, pull_request]
jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
        go:
          - "1.27"
          - "1.26"

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1.44.4
        with:
          perl-version: "5.44"

      - name: Install Server::Starter
        run: |
          cpanm --notest Server::Starter

      - name: Test
        run: |
          go test -v -race -coverprofile=profile.cov ./...
        env:
          SERVER_STARTER_INTEROP_REQUIRED: 1

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1.11.5
        with:
          path-to-profile: profile.cov
          flag-name: Go-${{ matrix.go }}-${{ matrix.os }}
          parallel: true

  listener:
    name: Test of the listener package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
        go:
          - "1.27"
          - "1.26"
          - "1.25"

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: listener/go.mod

      - name: Test
        run: |
          go test -v -race -coverprofile=profile.cov ./...
        working-directory: listener

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1.11.5
        with:
          path-to-profile: listener/profile.cov
          flag-name: Go-listener-${{ matrix.go }}-${{ matrix.os }}
          parallel: true

  bsd:
    name: Test of processUIDs on ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - freebsd
          - netbsd
          - openbsd

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1

      - name: Test on FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          usesh: true
          prepare: pkg install -y go
          run: go test -v -run 'Test_ProcessUIDs|Test_RestartAndStopVerifyPid' .

      - name: Test on NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1.5.3
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add go
            ls -d /usr/pkg/go1*
          # pkgsrc installs go under /usr/pkg/goXYZ without adding it to PATH.
          run: |
            PATH="$(ls -d /usr/pkg/go1* | tail -1)/bin:$PATH"
            go version
            go test -v -run 'Test_ProcessUIDs|Test_RestartAndStopVerifyPid' .

      - name: Test on OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1.4.9
        with:
          usesh: true
          prepare: pkg_add go
          run: go test -v -run 'Test_ProcessUIDs|Test_RestartAndStopVerifyPid' .

  # notifies that all test jobs are finished.
  finish:
    needs:
      - test
      - listener
    runs-on: ubuntu-latest
    steps:
      - uses: shogo82148/actions-goveralls@v1.11.5
        with:
          parallel-finished: true

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check GoReleaser configure
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: "~> v2"
          args: check
